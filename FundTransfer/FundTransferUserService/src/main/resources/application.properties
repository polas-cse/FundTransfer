# ===================================================
# Server Configuration
# ===================================================
server.port=9090
spring.application.name=user-service

# environment
spring.profiles.active=dev
#spring.profiles.active=prod

# ===================================================
# Eureka Configuration
# ===================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===================================================
# R2DBC Configuration (Reactive - Application)
# ===================================================
spring.data.r2dbc.repositories.enabled=true
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/fund-transfer
spring.r2dbc.username=fund-transfer
spring.r2dbc.password=fund-transfer
spring.r2dbc.properties.schema=user_service
spring.r2dbc.properties.currentSchema=user_service

# ===================================================
# JDBC Configuration (Liquibase Only)
# ===================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.datasource.username=fund-transfer
spring.datasource.password=fund-transfer
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================
# Liquibase Configuration
# ===================================================
spring.liquibase.enabled=true
spring.liquibase.drop-first=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=user_service
spring.liquibase.liquibase-schema=user_service
spring.liquibase.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.liquibase.user=fund-transfer
spring.liquibase.password=fund-transfer

# ===================================================
# Redis Configuration
# ===================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===================================================
# RabbitMQ Configuration
# ===================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=fundtransfer
spring.rabbitmq.password=fundtransfer
spring.rabbitmq.virtual-host=fundtransfer
# Manual ACK - prevents message loss
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Publisher confirms - wait for broker confirmation
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Retry on consumer failure
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=6000
# Connection recovery
spring.rabbitmq.listener.simple.missing-queues-fatal=false
# Connection pool settings
spring.rabbitmq.connection-timeout=10000

# ===================================================
# gRPC Client Configuration (calling Bank Service)
# =====================================================
grpc.client.bank-service.address=localhost:9191
grpc.client.bank-service.negotiation-type=plaintext

# ===================================================
# JWT Configuration
# ===================================================
jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===================================================
# Actuator Configuration
# ===================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================
# Logging Configuration
# ===================================================
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# ===================================================
# Static Resource Configuration
# ===================================================
# Disable default static resource locations to prevent interference with API routes
spring.web.resources.add-mappings=false
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.com.fund.transfer.user.service=DEBUG
# gRPC logging
logging.level.io.grpc=INFO
logging.level.net.devh=INFO
# RabbitMQ logging
logging.level.org.springframework.amqp=INFO
logging.level.com.rabbitmq=INFO