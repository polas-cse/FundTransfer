# ????????????????????????????????????????????????????????????????????????
# ?             DISCOVERY SERVICE ? APPLICATION CONFIGURATION            ?
# ?                                                                      ?
# ?  Service  : discovery-server (Eureka Server)                         ?
# ?  Port     : 8761                                                     ?
# ?  Role     : Service registry ? all microservices register here       ?
# ?  Database : PostgreSQL ? creates DB + user on first startup          ?
# ?  Note     : Does NOT register itself in Eureka                       ?
# ????????????????????????????????????????????????????????????????????????

# ??????????????????????????????????????????????????????????????????????
# SERVER
# ??????????????????????????????????????????????????????????????????????

# Eureka dashboard and API available at http://localhost:8761
server.port=8761

# service name ? used in logs and Spring Cloud context
spring.application.name=discovery-server

# active profile ? controls environment-specific overrides
# dev  ? local setup, debug logs
# prod ? production DB, info logs, TLS
spring.profiles.active=dev
#spring.profiles.active=prod

# ??????????????????????????????????????????????????????????????????????
# EUREKA SERVER
# ??????????????????????????????????????????????????????????????????????

# false ? this server does NOT register itself as a client
# true  ? would try to register with itself (causes errors)
eureka.client.register-with-eureka=false

# false ? does NOT fetch registry from another Eureka node
# true  ? needed only in multi-node Eureka cluster (HA setup)
eureka.client.fetch-registry=false

# 0ms ? start accepting registrations immediately on startup
# default is 5 minutes ? too long for local development
eureka.server.wait-time-in-ms-when-sync-empty=0

# how often Eureka checks for expired instances (milliseconds)
# default 60000 ? reduced for faster stale instance removal
eureka.server.eviction-interval-timer-in-ms=15000

# threshold % of clients that must send heartbeat ? below this Eureka
# enters self-preservation mode and stops evicting instances
# 0.49 ? disable self-preservation (dev only ? enable in prod)
eureka.server.renewal-percent-threshold=0.49

# true  ? Eureka keeps dead instances if heartbeats drop suddenly
# false ? always evict expired instances (dev friendly)
eureka.server.enable-self-preservation=false

# how often registry snapshots are sent to peer Eureka nodes (ms)
# only relevant in multi-node cluster
eureka.server.peer-eureka-nodes-update-interval-ms=10000

# ?? Eureka Dashboard ??????????????????????????????????????????????????

# true  ? enable web dashboard at http://localhost:8761
eureka.dashboard.enabled=true

# dashboard URL path
eureka.dashboard.path=/

# ??????????????????????????????????????????????????????????????????????
# SPRING AUTOCONFIGURE EXCLUSIONS
# ??????????????????????????????????????????????????????????????????????

# exclude DataSource autoconfiguration ? discovery service does NOT
# use Spring Data / JPA / R2DBC for its own queries
# it uses raw JDBC only inside DatabaseInitializer for DB setup
# without this exclusion, Spring Boot crashes looking for a DataSource bean
spring.autoconfigure.exclude= org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration, org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration, org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ??????????????????????????????????????????????????????????????????????
# DATABASE SUPERUSER ? INITIAL SETUP ONLY
# Used by DatabaseInitializer to create DB and app user on first run
# Never used again after first startup
# ??????????????????????????????????????????????????????????????????????

# postgres superuser connection ? connects to default 'postgres' database
# used to run: CREATE DATABASE, CREATE USER, GRANT PRIVILEGES
db.superuser.url=jdbc:postgresql://localhost:5432/postgres
db.superuser.username=postgres
db.superuser.password=admin

# ??????????????????????????????????????????????????????????????????????
# APPLICATION DATABASE ? WHAT TO CREATE
# DatabaseInitializer creates these if they don't exist
# All other services connect using these credentials
# ??????????????????????????????????????????????????????????????????????

# name of the database to create ? used by all microservices
db.app.name=fund-transfer

# application user ? owns the schemas and tables
db.app.username=fund-transfer
db.app.password=fund-transfer

# ??????????????????????????????????????????????????????????????????????
# ACTUATOR ? MONITORING & HEALTH
# ??????????????????????????????????????????????????????????????????????

# run actuator on separate internal port
management.server.port=8762

# expose only safe endpoints
management.endpoints.web.exposure.include=health,info,metrics

# block dangerous endpoints explicitly
management.endpoints.web.exposure.exclude=env,beans,shutdown

# show full health component details
management.endpoint.health.show-details=always

# custom base path ? harder for scanners to find
management.endpoints.web.base-path=/internal/actuator

# ??????????????????????????????????????????????????????????????????????
#
#   LOGGING LEVEL HIERARCHY
#
#   TRACE ? DEBUG ? INFO ? WARN ? ERROR ? OFF
#     ?       ?       ?      ?       ?      ?
#   most   detail  normal  warns  errors  none
#   detail  dev    prod    only   only
#
#   Setting a level includes everything ABOVE it:
#   DEBUG ? shows DEBUG + INFO + WARN + ERROR
#   INFO  ? shows INFO + WARN + ERROR  (hides DEBUG)
#   WARN  ? shows WARN + ERROR         (hides DEBUG + INFO)
#
# ??????????????????????????????????????????????????????????????????????

# ????????????????????????????????????????????????????????????????????
# ROOT ? fallback for all loggers not explicitly configured
# INFO  ? reasonable default, not too noisy
# ????????????????????????????????????????????????????????????????????

logging.level.root=INFO

# ????????????????????????????????????????????????????????????????????
# APPLICATION CODE
# DEBUG ? see all DatabaseInitializer log.debug() output
# ????????????????????????????????????????????????????????????????????

# entire discovery service package
# DEBUG ? see DB initialization steps, bean creation
logging.level.com.fund.transfer.discovery=DEBUG

# database initializer specifically ? DB/user creation logs
# DEBUG ? see "Creating database fund-transfer", "User already exists"
logging.level.com.fund.transfer.discovery.config=DEBUG

# ????????????????????????????????????????????????????????????????????
# SPRING CORE
# INFO  ? startup events, suppress internal framework noise
# ????????????????????????????????????????????????????????????????????

# spring framework ? bean wiring, context refresh
# INFO  ? shows context started/stopped events
logging.level.org.springframework=INFO

# spring boot autoconfiguration ? what was/wasn't configured
# INFO  ? useful to verify exclusions worked correctly
logging.level.org.springframework.boot.autoconfigure=INFO

# spring boot startup ? startup steps and timing
# INFO  ? shows "Started DiscoveryServerApplication in X seconds"
logging.level.org.springframework.boot=INFO

# ????????????????????????????????????????????????????????????????????
# EUREKA SERVER
# INFO  ? registration/heartbeat/eviction events
# DEBUG ? full registry state, lease calculations (very verbose)
# ????????????????????????????????????????????????????????????????????

# eureka server core ? registry management
# INFO  ? shows "Registered instance user-service:9090"
logging.level.com.netflix.eureka=INFO

# eureka server registry ? instance add/remove/renew events
# INFO  ? shows heartbeat received, instance expired
logging.level.com.netflix.eureka.registry=INFO

# eureka resource ? REST API calls to Eureka (/eureka/apps/*)
# INFO  ? shows which services called the registry API
logging.level.com.netflix.eureka.resources=INFO

# eureka discovery ? client-side lookup (minimal in server mode)
# INFO  ? shows peer node sync events
logging.level.com.netflix.discovery=INFO

# spring cloud eureka server ? Spring wrapper over Netflix Eureka
# INFO  ? shows Spring-level server startup events
logging.level.org.springframework.cloud.netflix.eureka=INFO

# ????????????????????????????????????????????????????????????????????
# SPRING WEB (MVC ? Eureka uses blocking MVC not WebFlux)
# INFO  ? request mapping setup only
# ????????????????????????????????????????????????????????????????????

# spring web MVC ? request handling, dispatcher servlet
# INFO  ? shows route mappings registered at startup
logging.level.org.springframework.web=INFO

# spring web servlet ? incoming HTTP to Eureka REST API
# INFO  ? shows request dispatch events
logging.level.org.springframework.web.servlet=INFO

# ????????????????????????????????????????????????????????????????????
# JDBC ? USED BY DatabaseInitializer ONLY
# DEBUG ? see DB creation SQL (dev only)
# ????????????????????????????????????????????????????????????????????

# jdbc template ? raw SQL execution in DatabaseInitializer
# DEBUG ? see "Executing SQL: CREATE DATABASE fund-transfer"
logging.level.org.springframework.jdbc=DEBUG

# jdbc datasource ? connection acquisition for raw JDBC
# DEBUG ? see "Acquired Connection from DataSource"
logging.level.org.springframework.jdbc.datasource=DEBUG

# ????????????????????????????????????????????????????????????????????
# NETTY / TOMCAT ? HTTP SERVER
# WARN  ? suppress internal server lifecycle noise
# ????????????????????????????????????????????????????????????????????

# embedded tomcat ? Eureka server uses Tomcat (not Netty)
# WARN  ? suppress connector/thread pool internal events
logging.level.org.apache.tomcat=WARN

# tomcat catalina ? servlet container lifecycle
# WARN  ? only show warnings and errors
logging.level.org.apache.catalina=WARN

# ????????????????????????????????????????????????????????????????????
# JACKSON ? JSON SERIALIZATION
# WARN  ? suppress normal mapping noise
# ????????????????????????????????????????????????????????????????????

# jackson ? Eureka uses JSON for registry API responses
# WARN  ? only log mapping errors
logging.level.com.fasterxml.jackson=WARN

# ????????????????????????????????????????????????????????????????????
# LOG FORMAT
# ????????????????????????????????????????????????????????????????????

# console pattern: timestamp | level (colored) | thread | logger | message
# %highlight ? ERROR=red WARN=yellow INFO=green DEBUG=cyan TRACE=blue
# %cyan      ? logger name in cyan for readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) : %msg%n

# file pattern ? no ANSI color codes (files don't render colors)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n

# enable ANSI color output in IntelliJ console and terminal
spring.output.ansi.enabled=always

# ????????????????????????????????????????????????????????????????????
# LOG FILE OUTPUT
# ????????????????????????????????????????????????????????????????????

# write logs to file ? in addition to console
logging.file.name=logs/discovery-server.log

# roll over to new file when size reaches 10MB
logging.logback.rollingpolicy.max-file-size=10MB

# keep last 30 days of log files
logging.logback.rollingpolicy.max-history=30

# total disk cap for all log files combined
logging.logback.rollingpolicy.total-size-cap=200MB

# clean oversized logs on startup
logging.logback.rollingpolicy.clean-history-on-start=false