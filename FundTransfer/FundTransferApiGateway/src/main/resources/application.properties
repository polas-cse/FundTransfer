# ????????????????????????????????????????????????????????????????????????
# ?              API GATEWAY ? APPLICATION CONFIGURATION                ?
# ?                                                                      ?
# ?  Service  : api-gateway                                             ?
# ?  Port     : 8080 (HTTP)  |  8183 (Actuator)                        ?
# ?  Database : PostgreSQL ? schema: gateway_service                    ?
# ?  Role     : Entry point ? routes, security, threat detection        ?
# ?  Registry : Eureka ? localhost:8761                                 ?
# ????????????????????????????????????????????????????????????????????????

# ??????????????????????????????????????????????????????????????????????
# SERVER
# ??????????????????????????????????????????????????????????????????????

# all external traffic enters through this port
server.port=8080

# service name ? used by Eureka, Spring Cloud, log identification
spring.application.name=api-gateway

# active profile ? controls which application-{profile}.properties loads
# dev  ? debug logs, CORS=*, plaintext, no TLS
# prod ? info logs, strict CORS, TLS
spring.profiles.active=dev
#spring.profiles.active=prod

# enable ANSI color output in IntelliJ console and terminal
spring.output.ansi.enabled=always

# ??????????????????????????????????????????????????????????????????????
# CORS ? ALLOWED ORIGINS
# ??????????????????????????????????????????????????????????????????????

# dev only ? * allows all origins (disables CORS protection)
# prod: specify exact origins to prevent CSRF and unauthorized access
security.cors.allowed-origins=*
#security.cors.allowed-origins=http://localhost:3000,https://yourdomain.com

# ??????????????????????????????????????????????????????????????????????
# EUREKA ? SERVICE DISCOVERY
# ??????????????????????????????????????????????????????????????????????

# Eureka server URL ? where to register and fetch registry from
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# register gateway in Eureka ? other services can see it
eureka.client.register-with-eureka=true

# download registry ? enables lb://user-service and lb://bank-service routing
eureka.client.fetch-registry=true

# use IP instead of hostname ? required for Docker/Kubernetes environments
eureka.instance.prefer-ip-address=true

# unique instance ID in Eureka ? visible in Eureka dashboard
# format: api-gateway:8080
eureka.instance.instance-id=${spring.application.name}:${server.port}

# how often heartbeat is sent to Eureka (seconds) ? default 30
eureka.instance.lease-renewal-interval-in-seconds=15

# how long Eureka waits before removing instance with no heartbeat (seconds)
eureka.instance.lease-expiration-duration-in-seconds=45

# ??????????????????????????????????????????????????????????????????????
# JWT ? TOKEN VALIDATION
# ??????????????????????????????????????????????????????????????????????

# SECURITY ? must match secret used by user-service to sign tokens
# change in production ? use: openssl rand -base64 64
jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars

# ??????????????????????????????????????????????????????????????????????
# GATEWAY ROUTES ? PUBLIC (no auth required)
# These routes bypass AuthorizationHeaderFilter
# ??????????????????????????????????????????????????????????????????????

# ?? Login ?????????????????????????????????????????????????????????????
# incoming : POST /user-service/auth/login
# routed to: lb://user-service ? POST /auth/login  (StripPrefix removes /user-service)
spring.cloud.gateway.routes[0].id=user-login
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-service/auth/login
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# ?? Register ??????????????????????????????????????????????????????????
# incoming : POST /user-service/auth/register
# routed to: lb://user-service ? POST /auth/register
spring.cloud.gateway.routes[1].id=user-register
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/user-service/auth/register
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# ??????????????????????????????????????????????????????????????????????
# GATEWAY ROUTES ? PROTECTED (JWT auth required)
# AuthorizationHeaderFilter validates JWT before forwarding
# ??????????????????????????????????????????????????????????????????????

# ?? User Service ??????????????????????????????????????????????????????
# incoming : ANY /user-service/**
# routed to: lb://user-service ? /**  (StripPrefix removes /user-service)
# auth     : AuthorizationHeaderFilter validates JWT + injects X-User-* headers
spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[1]=AuthorizationHeaderFilter

# ?? Bank Service ??????????????????????????????????????????????????????
# incoming : ANY /bank-service/**
# routed to: lb://bank-service ? /**  (StripPrefix removes /bank-service)
# auth     : AuthorizationHeaderFilter validates JWT + injects X-User-* headers
spring.cloud.gateway.routes[3].id=bank-service
spring.cloud.gateway.routes[3].uri=lb://bank-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/bank-service/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].filters[1]=AuthorizationHeaderFilter

# ??????????????????????????????????????????????????????????????????????
# R2DBC ? REACTIVE DATABASE CONNECTION
# Used to persist security audit logs from ThreatDetectionFilter
# ??????????????????????????????????????????????????????????????????????

# enable Spring Data R2DBC repositories ? SecurityLogRepository works
spring.data.r2dbc.repositories.enabled=true

# schema must be set in URL ? only working method for PostgreSQL R2DBC
# spring.r2dbc.properties.schema       ? does NOT work
# spring.r2dbc.properties.currentSchema ? does NOT work
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/fund-transfer?schema=gateway_service

# PostgreSQL credentials ? must match DatabaseInitializer setup
spring.r2dbc.username=fund-transfer
spring.r2dbc.password=fund-transfer

# ?? Connection Pool ???????????????????????????????????????????????????

# enable connection pooling ? reuse connections instead of create/close
spring.r2dbc.pool.enabled=true

# connections created at startup ? ready before first audit log insert
spring.r2dbc.pool.initial-size=5

# maximum simultaneous connections ? high traffic needs more pool capacity
spring.r2dbc.pool.max-size=20

# idle connection timeout ? close unused connections after 30 minutes
spring.r2dbc.pool.max-idle-time=30m

# max time to wait for a connection from pool before giving up
spring.r2dbc.pool.max-acquire-time=30s

# verify connection is alive before using ? prevents stale connection errors
spring.r2dbc.pool.validation-query=SELECT 1

# ??????????????????????????????????????????????????????????????????????
# JDBC ? USED BY LIQUIBASE ONLY (not for app queries)
# ??????????????????????????????????????????????????????????????????????

# separate JDBC datasource ? Liquibase requires blocking JDBC, not R2DBC
spring.datasource.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.datasource.username=fund-transfer
spring.datasource.password=fund-transfer
spring.datasource.driver-class-name=org.postgresql.Driver

# ??????????????????????????????????????????????????????????????????????
# LIQUIBASE ? DATABASE MIGRATION
# Creates security_audit_log table in gateway_service schema
# ??????????????????????????????????????????????????????????????????????

# enable Liquibase ? runs migrations on startup
spring.liquibase.enabled=true

# DANGER ? drop-first=true drops ALL audit log data before migrating
# NEVER use in production ? all security logs permanently deleted
# only for local dev when you want a clean audit table
spring.liquibase.drop-first=false

# master changelog file ? entry point for all migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# schema where security_audit_log table is created
spring.liquibase.default-schema=gateway_service

# schema where Liquibase tracking tables (databasechangelog) are stored
# must match default-schema to avoid checksum issues on restart
spring.liquibase.liquibase-schema=gateway_service

# JDBC URL for Liquibase ? separate from R2DBC URL
spring.liquibase.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.liquibase.user=fund-transfer
spring.liquibase.password=fund-transfer

# ??????????????????????????????????????????????????????????????????????
# SECURITY ? THREAT DETECTION (ThreatDetectionFilter)
# ??????????????????????????????????????????????????????????????????????

# ?? Rate Limiting ?????????????????????????????????????????????????????

# max requests per IP per minute ? above this ? 429 Too Many Requests
security.rate-limit.max-requests-per-ip=100

# max requests per authenticated user per minute
security.rate-limit.max-requests-per-user=60

# max failed login attempts before brute force detection triggers
security.rate-limit.max-failed-login=5

# ?? Payload ???????????????????????????????????????????????????????????

# max request body size ? 10485760 bytes = 10MB
# requests above this size ? 413 Payload Too Large
security.payload.max-size-bytes=10485760

# ??????????????????????????????????????????????????????????????????????
# STATIC RESOURCES
# ??????????????????????????????????????????????????????????????????????

# disable static file serving ? gateway is a pure routing/security layer
# prevents /static, /public folders from interfering with route matching
spring.web.resources.add-mappings=false

# ??????????????????????????????????????????????????????????????????????
# ACTUATOR ? MONITORING & HEALTH
# ??????????????????????????????????????????????????????????????????????

# run actuator on separate port ? not exposed to public traffic
management.server.port=8183

# only expose safe endpoints ? never expose env/beans/shutdown
management.endpoints.web.exposure.include=health,info,metrics

# explicitly block dangerous endpoints
management.endpoints.web.exposure.exclude=env,beans,shutdown

# show full health details ? DB, diskspace, gateway routes
management.endpoint.health.show-details=always
# production: use when-authorized instead of always

# custom base path ? harder for scanners to find
management.endpoints.web.base-path=/internal/actuator

# ??????????????????????????????????????????????????????????????????????
#
#   LOGGING LEVEL HIERARCHY
#
#   TRACE ? DEBUG ? INFO ? WARN ? ERROR ? OFF
#     ?       ?       ?      ?       ?      ?
#   most   detail  normal  warns  errors  none
#   detail  dev    prod    only   only
#
#   Setting a level includes everything ABOVE it:
#   DEBUG ? shows DEBUG + INFO + WARN + ERROR
#   INFO  ? shows INFO + WARN + ERROR  (hides DEBUG)
#   WARN  ? shows WARN + ERROR         (hides DEBUG + INFO)
#
# ??????????????????????????????????????????????????????????????????????

# ????????????????????????????????????????????????????????????????????
# ROOT ? fallback for all loggers not explicitly configured
# INFO  ? reasonable default, not too noisy
# ????????????????????????????????????????????????????????????????????

logging.level.root=INFO

# ????????????????????????????????????????????????????????????????????
# APPLICATION CODE
# DEBUG ? see all filter/security/audit log.debug() calls
# ????????????????????????????????????????????????????????????????????

# entire gateway application package
# DEBUG ? all layers visible including ThreatDetectionFilter
logging.level.com.fund.transfer.api.gateway=DEBUG

# threat detection filter ? attack pattern matching, block decisions
# DEBUG ? see "Skipping password field", pattern match results
logging.level.com.fund.transfer.api.gateway.cyber.audit=DEBUG

# security audit service ? event recording, DB inserts
# DEBUG ? see "Saving security event", async publish calls
logging.level.com.fund.transfer.api.gateway.cyber.service=DEBUG

# authorization header filter ? JWT validation, role extraction
# DEBUG ? see token claims, X-User-* header injection
logging.level.com.fund.transfer.api.gateway.security=DEBUG

# rate limit tracker ? IP/user counters, DDoS detection
# DEBUG ? see counter increments, threshold breach events
logging.level.com.fund.transfer.api.gateway.security.audit=DEBUG

# gateway config ? route registration, bean setup
# INFO  ? only startup events (config is noisy at DEBUG)
logging.level.com.fund.transfer.api.gateway.config=INFO

# ????????????????????????????????????????????????????????????????????
# SPRING CORE
# INFO  ? startup events only, hides internal framework noise
# ????????????????????????????????????????????????????????????????????

# spring framework ? bean creation, dependency injection
# INFO  ? shows context startup but not every bean wire
logging.level.org.springframework=INFO

# spring boot autoconfiguration ? what was/wasn't auto-configured
# INFO  ? confirms LiquibaseAutoConfiguration excluded correctly
logging.level.org.springframework.boot.autoconfigure=INFO

# spring security ? filter chain, auth decisions
# DEBUG ? see token extraction, role matching, 401/403 decisions
logging.level.org.springframework.security=DEBUG

# spring transaction ? begin/commit/rollback events
# DEBUG ? see transaction boundaries around audit log inserts
logging.level.org.springframework.transaction=DEBUG

# ????????????????????????????????????????????????????????????????????
# SPRING CLOUD GATEWAY
# DEBUG ? see full route matching, filter chain, load balancing
# ????????????????????????????????????????????????????????????????????

# gateway core ? all gateway routing activity
# DEBUG ? see full filter chain execution per request
logging.level.org.springframework.cloud.gateway=DEBUG

# route predicate ? shows which route matched each request
# DEBUG ? see "Route matched: user-login", "No route found"
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG

# filter chain ? all filters executed in order per request
# DEBUG ? see ThreatDetectionFilter, AuthorizationHeaderFilter order
logging.level.org.springframework.cloud.gateway.handler.FilteringWebHandler=DEBUG

# route definitions ? routes loaded from configuration at startup
# DEBUG ? see route predicates and filters registered
logging.level.org.springframework.cloud.gateway.route=DEBUG

# load balancer ? which service instance was selected
# DEBUG ? see "Selected instance: user-service:9090"
logging.level.org.springframework.cloud.gateway.filter.ReactiveLoadBalancerClientFilter=DEBUG

# ????????????????????????????????????????????????????????????????????
# SPRING WEBFLUX ? REACTIVE WEB
# DEBUG ? see reactive request/response lifecycle
# ????????????????????????????????????????????????????????????????????

# webflux core ? reactive request handling lifecycle
# DEBUG ? see Mono/Flux chain execution per gateway request
logging.level.org.springframework.web.reactive=DEBUG

# codec ? request/response body encoding and decoding
# DEBUG ? see Content-Type negotiation, body buffering for scan
logging.level.org.springframework.http.codec=DEBUG

# netty HTTP server ? low level request/response frames
# DEBUG ? see raw HTTP headers, connection accepted events
logging.level.org.springframework.http.server.reactive=DEBUG

# ????????????????????????????????????????????????????????????????????
# EUREKA ? SERVICE DISCOVERY
# INFO  ? registration/heartbeat events only
# ????????????????????????????????????????????????????????????????????

# eureka client ? registration, heartbeat, registry fetch
# INFO  ? shows "Registered api-gateway with Eureka"
logging.level.com.netflix.eureka=INFO

# eureka discovery ? service instance lookup
# INFO  ? shows registry refresh events
logging.level.com.netflix.discovery=INFO

# spring cloud eureka ? Spring wrapper events
# INFO  ? shows Spring-level registration events
logging.level.org.springframework.cloud.netflix.eureka=INFO

# load balancer ? instance list, health filtering, round-robin
# INFO  ? shows which instance was chosen for routing
logging.level.org.springframework.cloud.loadbalancer=INFO

# ????????????????????????????????????????????????????????????????????
# R2DBC ? REACTIVE DATABASE (audit log persistence)
# DEBUG ? see audit log inserts, connection pool events
#  QUERY + PARAM must be OFF in production
# ????????????????????????????????????????????????????????????????????

# spring data r2dbc ? repository, entity mapping, result reading
# DEBUG ? see "Executing SQL statement [INSERT INTO security_audit_log]"
logging.level.org.springframework.data.r2dbc=DEBUG

# r2dbc core ? connection lifecycle, transaction management
# DEBUG ? see "Acquired connection", "Released connection"
logging.level.org.springframework.r2dbc=DEBUG

# r2dbc connection pool ? pool acquire/release/create/destroy
# DEBUG ? see pool size changes, wait queue events
logging.level.io.r2dbc.pool=DEBUG

# r2dbc spi ? low level SPI calls (very verbose, dev only)
# DEBUG ? see every SPI method call
logging.level.io.r2dbc.spi=DEBUG

# postgresql r2dbc driver ? all driver-level activity
# DEBUG ? see driver state, protocol events
logging.level.io.r2dbc.postgresql=DEBUG

# SECURITY ? logs every SQL query (dev only)
# OFF in production ? exposes security_audit_log schema structure
# DEBUG ? "Executing query: INSERT INTO security_audit_log (...)"
logging.level.io.r2dbc.postgresql.QUERY=DEBUG

# SECURITY ? logs every bind parameter value (dev only)
# OFF in production ? logs IP addresses, attack payloads, user data
# DEBUG ? "Bind parameter [6] to: SQL_INJECTION"
logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# postgresql wire protocol ? raw TCP frames (extremely verbose)
# DEBUG ? see every byte exchanged with PostgreSQL
logging.level.io.r2dbc.postgresql.client.ReactorNettyClient=DEBUG

# ????????????????????????????????????????????????????????????????????
# LIQUIBASE ? DATABASE MIGRATION
# INFO  ? only migration results, not internal SQL
# ????????????????????????????????????????????????????????????????????

# liquibase core ? migration run lifecycle
# INFO  ? shows "Running Changeset: 001-create-security-audit-log"
logging.level.liquibase=INFO

# changelog ? which changesets ran, skipped, or MARK_RAN
# DEBUG ? see preCondition results, skip reasons
logging.level.liquibase.changelog=DEBUG

# executor ? SQL being sent to DB by Liquibase
# DEBUG ? see exact DDL for security_audit_log table creation
logging.level.liquibase.executor=DEBUG

# lockservice ? changelog lock acquire and release
# DEBUG ? see lock state (prevents parallel migration conflicts)
logging.level.liquibase.lockservice=DEBUG

# ????????????????????????????????????????????????????????????????????
# NETTY ? REACTIVE HTTP SERVER
# WARN  ? suppress netty internal noise
# ????????????????????????????????????????????????????????????????????

# netty core ? event loop, channel pipeline setup
# WARN  ? suppress verbose internal lifecycle events
logging.level.io.netty=WARN

# netty HTTP codec ? HTTP request/response encoding/decoding
# DEBUG ? see HTTP headers being parsed per incoming request
logging.level.io.netty.handler.codec.http=DEBUG

# netty SSL/TLS handler ? TLS handshake details
# INFO  ? shows TLS version, cipher suite negotiated
logging.level.io.netty.handler.ssl=INFO

# reactor netty ? reactive HTTP transport layer
# INFO  ? shows server bind events, connection pool stats
logging.level.reactor.netty=INFO

# reactor netty http server ? all incoming requests at transport level
# DEBUG ? see raw request lines, connection accepted/closed events
logging.level.reactor.netty.http.server=DEBUG

# reactor netty http client ? outgoing requests to downstream services
# DEBUG ? see forwarded request headers, response status from services
logging.level.reactor.netty.http.client=DEBUG

# ????????????????????????????????????????????????????????????????????
# REACTOR ? PROJECT REACTOR (MONO / FLUX)
# INFO  ? suppress reactive chain noise
# ????????????????????????????????????????????????????????????????????

# reactor core ? Mono/Flux operators (very verbose at DEBUG)
# INFO  ? suppress internal operator chain noise
logging.level.reactor.core=INFO

# reactor publisher ? onNext/onComplete/onError events
# WARN  ? hide subscription/completion spam from every operator
logging.level.reactor.core.publisher=WARN

# ????????????????????????????????????????????????????????????????????
# JACKSON ? JSON SERIALIZATION
# WARN  ? only log errors, suppress normal mapping noise
# ????????????????????????????????????????????????????????????????????

# jackson ? JSON parsing and generation for gateway responses
# WARN  ? suppress normal mapping operations
logging.level.com.fasterxml.jackson=WARN

# jackson databind ? object to JSON mapping
# WARN  ? only show mapping errors
logging.level.com.fasterxml.jackson.databind=WARN

# ????????????????????????????????????????????????????????????????????
# LOG FORMAT
# ????????????????????????????????????????????????????????????????????

# console pattern: timestamp | level (colored) | thread | logger | message
# %highlight ? ERROR=red WARN=yellow INFO=green DEBUG=cyan TRACE=blue
# %cyan      ? logger name in cyan for readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) : %msg%n

# file pattern ? no ANSI color codes (files don't render colors)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n

# ????????????????????????????????????????????????????????????????????
# LOG FILE OUTPUT
# ????????????????????????????????????????????????????????????????????

# write logs to file ? in addition to console output
logging.file.name=logs/api-gateway.log

# roll over to new file when current reaches 10MB
logging.logback.rollingpolicy.max-file-size=10MB

# keep last 30 days of rolled log files
logging.logback.rollingpolicy.max-history=30

# total disk space cap ? gateway logs can be large due to audit events
logging.logback.rollingpolicy.total-size-cap=1GB

# delete old log files on startup if total-size-cap exceeded
logging.logback.rollingpolicy.clean-history-on-start=false