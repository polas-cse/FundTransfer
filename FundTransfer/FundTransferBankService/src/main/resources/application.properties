# ????????????????????????????????????????????????????????????????????????
# ?            BANK SERVICE ? APPLICATION CONFIGURATION                  ?
# ?                                                                      ?
# ?  Service  : bank-service                                             ?
# ?  Port     : 9091 (HTTP)  |  9191 (gRPC)                              ?
# ?  Actuator : 8182                                                     ?
# ?  Database : PostgreSQL ? schema: banking_service                     ?
# ?  Broker   : RabbitMQ                                                 ?
# ?  gRPC     : exposes gRPC server on 9191 (called by user-service)     ?
# ?  Registry : Eureka ? localhost:8761                                  ?
# ????????????????????????????????????????????????????????????????????????


# ??????????????????????????????????????????????????????????????????????
# SERVER
# ??????????????????????????????????????????????????????????????????????

# HTTP port this service listens on
server.port=9091

# disable static file serving ? this is a pure REST + gRPC service
# prevents /static, /public folders from interfering with API routes
spring.web.resources.add-mappings=false


# ??????????????????????????????????????????????????????????????????????
# APPLICATION
# ??????????????????????????????????????????????????????????????????????

# service name ? used by Eureka, Spring Cloud, log identification
spring.application.name=bank-service

# active profile ? controls which application-{profile}.properties loads
# dev  ? debug logs, local DB, plaintext gRPC, no TLS
# prod ? info logs, real DB, TLS gRPC
spring.profiles.active=dev
#spring.profiles.active=prod

# enable ANSI color output in IntelliJ console and terminal
spring.output.ansi.enabled=always


# ??????????????????????????????????????????????????????????????????????
# EUREKA ? SERVICE DISCOVERY
# ??????????????????????????????????????????????????????????????????????

# Eureka server URL ? where to register and fetch registry from
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# register this service in Eureka so others can discover it via lb://bank-service
eureka.client.register-with-eureka=true

# download registry of all services ? enables lb:// calls to other services
eureka.client.fetch-registry=true

# use IP instead of hostname ? required for Docker/Kubernetes environments
eureka.instance.prefer-ip-address=true

# unique instance ID in Eureka ? visible in Eureka dashboard
# format: bank-service:9091
eureka.instance.instance-id=${spring.application.name}:${server.port}

# how often heartbeat is sent to Eureka (seconds) ? default 30
eureka.instance.lease-renewal-interval-in-seconds=15

# how long Eureka waits before removing instance with no heartbeat (seconds)
eureka.instance.lease-expiration-duration-in-seconds=45


# ??????????????????????????????????????????????????????????????????????
# R2DBC ? REACTIVE DATABASE CONNECTION
# ??????????????????????????????????????????????????????????????????????

# enable Spring Data R2DBC repositories ? @Repository interfaces work
spring.data.r2dbc.repositories.enabled=true

# schema must be set in URL ? only working method for PostgreSQL R2DBC
# spring.r2dbc.properties.schema        ? does NOT work
# spring.r2dbc.properties.currentSchema ? does NOT work
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/fund-transfer?schema=banking_service

# PostgreSQL credentials ? must match DatabaseInitializer setup
spring.r2dbc.username=fund-transfer
spring.r2dbc.password=fund-transfer

# ?? Connection Pool ??????????????????????????????????????????????????

# enable connection pooling ? reuse connections instead of create/close
spring.r2dbc.pool.enabled=true

# connections created at startup ? ready before first request arrives
spring.r2dbc.pool.initial-size=5

# maximum simultaneous connections ? requests wait if pool is full
spring.r2dbc.pool.max-size=20

# idle connection timeout ? close unused connections after 30 minutes
spring.r2dbc.pool.max-idle-time=30m

# max time to wait for a connection from pool before giving up
spring.r2dbc.pool.max-acquire-time=30s

# verify connection is alive before using ? prevents stale connection errors
spring.r2dbc.pool.validation-query=SELECT 1


# ??????????????????????????????????????????????????????????????????????
# JDBC ? USED BY LIQUIBASE ONLY (not for app queries)
# ??????????????????????????????????????????????????????????????????????

# separate JDBC datasource ? Liquibase requires blocking JDBC, not R2DBC
spring.datasource.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.datasource.username=fund-transfer
spring.datasource.password=fund-transfer
spring.datasource.driver-class-name=org.postgresql.Driver


# ??????????????????????????????????????????????????????????????????????
# LIQUIBASE ? DATABASE MIGRATION
# ??????????????????????????????????????????????????????????????????????

# enable Liquibase ? runs migrations on startup
spring.liquibase.enabled=true

#  DANGER ? drop-first=true drops ALL tables before migrating
# NEVER use in production ? permanent data loss
# only for local dev when you want a completely clean slate
spring.liquibase.drop-first=true

# master changelog file ? entry point for all migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# schema where application tables are created
spring.liquibase.default-schema=banking_service

# schema where Liquibase tracking tables (databasechangelog) are stored
# must match default-schema to avoid checksum issues on restart
spring.liquibase.liquibase-schema=banking_service

# JDBC URL for Liquibase ? separate from R2DBC URL
spring.liquibase.url=jdbc:postgresql://localhost:5432/fund-transfer
spring.liquibase.user=fund-transfer
spring.liquibase.password=fund-transfer


# ??????????????????????????????????????????????????????????????????????
# REDIS ? CACHING / SESSION / RATE LIMITING
# ??????????????????????????????????????????????????????????????????????

# Redis server host
spring.data.redis.host=localhost

# Redis default port
spring.data.redis.port=6379

# Redis database index ? 0 to 15 (default 0)
spring.data.redis.database=0

# connection timeout ? how long to wait when connecting (milliseconds)
spring.data.redis.connect-timeout=2000

# read/write timeout ? how long to wait for a response (milliseconds)
spring.data.redis.timeout=2000


# ??????????????????????????????????????????????????????????????????????
# RABBITMQ ? MESSAGE BROKER
# ??????????????????????????????????????????????????????????????????????

# RabbitMQ server address
spring.rabbitmq.host=localhost

# AMQP protocol port (5671 for TLS)
spring.rabbitmq.port=5672

# credentials ? created via: rabbitmqctl add_user fundtransfer fundtransfer
spring.rabbitmq.username=fundtransfer
spring.rabbitmq.password=fundtransfer

# virtual host ? namespace isolation (like a schema in PostgreSQL)
# created via: rabbitmqctl add_vhost fundtransfer
spring.rabbitmq.virtual-host=fundtransfer

# time to wait when establishing broker connection before failing (ms)
spring.rabbitmq.connection-timeout=10000

# ?? Message Acknowledgement ??????????????????????????????????????????

# MANUAL ? message stays in queue until your code calls basicAck()
# AUTO   ? message deleted immediately on receive (risk: lost on crash)
# NONE   ? no acknowledgement (fire and forget)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# false ? app does NOT crash if queue doesn't exist yet on startup
# true  ? app crashes immediately if any listened queue is missing
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ?? Publisher Confirms ???????????????????????????????????????????????

# CORRELATED ? each message gets unique ID, confirms matched per message
# SIMPLE     ? basic confirm, no per-message correlation
# NONE       ? no confirmation (fastest but risky)
spring.rabbitmq.publisher-confirm-type=correlated

# return unroutable messages back to producer instead of dropping silently
spring.rabbitmq.publisher-returns=true

# required for publisher-returns to work ? forces broker to return undeliverables
spring.rabbitmq.template.mandatory=true

# ?? Consumer Retry ???????????????????????????????????????????????????

# retry failed messages instead of immediately dead-lettering
spring.rabbitmq.listener.simple.retry.enabled=true

# wait 500ms before first retry
spring.rabbitmq.listener.simple.retry.initial-interval=500

# maximum 3 total attempts (1 original + 2 retries) then ? DLQ
spring.rabbitmq.listener.simple.retry.max-attempts=3

# exponential backoff multiplier
# attempt 1 ? 500ms | attempt 2 ? 1000ms | attempt 3 ? 2000ms (capped)
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# retry wait will never exceed 3 seconds regardless of multiplier
spring.rabbitmq.listener.simple.retry.max-interval=3000


# ??????????????????????????????????????????????????????????????????????
# gRPC SERVER ? BANK SERVICE EXPOSES gRPC
# ??????????????????????????????????????????????????????????????????????

# port gRPC server listens on ? user-service connects to this
# separate from HTTP port (9091) ? gRPC runs on its own port
grpc.server.port=9191

# ?? Development (plaintext ? no TLS) ????????????????????????????????

# plaintext ? no encryption ? dev only
# clients must set negotiation-type=plaintext to connect
grpc.server.security.enabled=false

# ?? Production (enable TLS) ?????????????????????????????????????????
#grpc.server.security.enabled=true
#grpc.server.security.certificate-chain=classpath:certs/server.crt
#grpc.server.security.private-key=classpath:certs/server.key


# ??????????????????????????????????????????????????????????????????????
# JWT ? TOKEN CONFIGURATION
# ??????????????????????????????????????????????????????????????????????

#  SECURITY ? change this in production, min 32 characters
# generate with: openssl rand -base64 64
jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars

# access token expiry ? 86400000ms = 24 hours
jwt.expiration=86400000

# refresh token expiry ? 604800000ms = 7 days
jwt.refresh-expiration=604800000


# ??????????????????????????????????????????????????????????????????????
# ACTUATOR ? MONITORING & HEALTH
# ??????????????????????????????????????????????????????????????????????

# run actuator on a separate port ? not exposed to public traffic
#management.server.port=8182

# bind actuator to all interfaces ? REQUIRED for Prometheus (Docker) to scrape
# without this ? Prometheus gets "connection refused" on 8182
# 0.0.0.0 ? accepts connections from Docker network (192.168.x.x)
# 127.0.0.1 (default) ? only accepts from same machine ? Docker cannot reach it
#management.server.address=0.0.0.0

# only expose safe endpoints ? never expose env/beans/shutdown
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# explicitly block dangerous endpoints
management.endpoints.web.exposure.exclude=env,beans,shutdown

# show full health details ? DB status, disk, RabbitMQ, Redis
# production: change to when-authorized
management.endpoint.health.show-details=always

# custom base path ? harder for scanners to find
management.endpoints.web.base-path=/internal/actuator


# ??????????????????????????????????????????????????????????????????????
# METRICS ? PROMETHEUS / MICROMETER
# ??????????????????????????????????????????????????????????????????????

# enable Prometheus metrics export ? required for Grafana integration
# Spring Boot 3.x key (management.metrics.export.* is deprecated)
management.prometheus.metrics.export.enabled=true

# expose /internal/actuator/prometheus endpoint
management.endpoint.prometheus.enabled=true

# ?? Metric Categories ????????????????????????????????????????????????

# JVM metrics ? heap, GC, threads, classes
management.metrics.enable.jvm=true

# system metrics ? CPU, file descriptors
management.metrics.enable.system=true

# process metrics ? uptime, CPU usage, memory
management.metrics.enable.process=true

# HTTP server metrics ? request count, response time
management.metrics.enable.http=true

# ?? HTTP Request Histograms ??????????????????????????????????????????

# enable histogram buckets for response time distribution
# required for p50/p95/p99 percentile graphs in Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# percentiles to calculate and export
# p50=median | p75=typical | p95=slow | p99=very slow
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99

# auto-time all HTTP requests ? adds http_server_requests_seconds metric
management.metrics.web.server.request.autotime.enabled=true


# ??????????????????????????????????????????????????????????????????????
# APPLICATION INFO ? shown at /internal/actuator/info
# ??????????????????????????????????????????????????????????????????????

info.app.name=Bank Service
info.app.description=Fund Transfer Bank Microservice
info.app.version=1.0.0


# ??????????????????????????????????????????????????????????????????????
#
#   LOGGING LEVEL HIERARCHY
#
#   TRACE ? DEBUG ? INFO ? WARN ? ERROR ? OFF
#     ?       ?       ?      ?       ?      ?
#   most   detail  normal  warns  errors  none
#   detail  dev    prod    only   only
#
#   Setting a level includes everything ABOVE it:
#   DEBUG ? shows DEBUG + INFO + WARN + ERROR
#   INFO  ? shows INFO + WARN + ERROR  (hides DEBUG)
#   WARN  ? shows WARN + ERROR         (hides DEBUG + INFO)
#
# ??????????????????????????????????????????????????????????????????????

# ?? Root ?????????????????????????????????????????????????????????????
# fallback for all loggers not explicitly configured
# INFO ? reasonable default, not too noisy
logging.level.root=INFO

# ?? Application Code ?????????????????????????????????????????????????

# entire application package ? all layers visible
logging.level.com.fund.transfer.bank.service=DEBUG

# controllers ? incoming request handling, response building
logging.level.com.fund.transfer.bank.service.controller=DEBUG

# services ? business logic, bank account operations
logging.level.com.fund.transfer.bank.service.service=DEBUG

# repositories ? database query execution
logging.level.com.fund.transfer.bank.service.repository=DEBUG

# filters ? security/auth filter chain execution
logging.level.com.fund.transfer.bank.service.filter=DEBUG

# config ? bean creation, configuration loading (INFO ? not noisy)
logging.level.com.fund.transfer.bank.service.config=INFO

# security ? JWT validation, role checks
logging.level.com.fund.transfer.bank.service.security=DEBUG

# ?? Spring Core ??????????????????????????????????????????????????????

# spring framework ? bean creation, dependency injection
logging.level.org.springframework=INFO

# application context ? refresh, bean lifecycle events
logging.level.org.springframework.context=INFO

# auto-configuration ? what was/wasn't auto-configured
logging.level.org.springframework.boot.autoconfigure=INFO

# web layer ? request mapping, handler resolution
logging.level.org.springframework.web=DEBUG

# security ? filter chain, auth decisions, access control
logging.level.org.springframework.security=DEBUG

# transaction ? begin/commit/rollback events
logging.level.org.springframework.transaction=DEBUG

# ?? Spring WebFlux ? Reactive Web ????????????????????????????????????

# webflux core ? reactive request handling lifecycle
logging.level.org.springframework.web.reactive=DEBUG

# result handlers ? how response is written back to client
logging.level.org.springframework.web.reactive.result=DEBUG

# codec ? request/response body serialization
logging.level.org.springframework.http.codec=DEBUG

# netty HTTP server ? low level request/response frames
logging.level.org.springframework.http.server.reactive=DEBUG

# ?? Eureka ? Service Discovery ???????????????????????????????????????

# eureka client ? registration, heartbeat, registry fetch
logging.level.com.netflix.eureka=INFO

# eureka discovery ? instance lookup, cache updates
logging.level.com.netflix.discovery=INFO

# spring cloud eureka ? Spring wrapper events
logging.level.org.springframework.cloud.netflix.eureka=INFO

# load balancer ? instance selection, health filtering
logging.level.org.springframework.cloud.loadbalancer=INFO

# ?? R2DBC ? Reactive Database ????????????????????????????????????????

# spring data r2dbc ? repository, entity mapping, result reading
logging.level.org.springframework.data.r2dbc=DEBUG

# r2dbc core ? connection lifecycle, transaction management
logging.level.org.springframework.r2dbc=DEBUG

# r2dbc connection pool ? pool acquire/release/create/destroy
logging.level.io.r2dbc.pool=DEBUG

# r2dbc spi ? low level SPI calls (very verbose, dev only)
logging.level.io.r2dbc.spi=DEBUG

# postgresql r2dbc driver ? all driver-level activity
logging.level.io.r2dbc.postgresql=DEBUG

#  SECURITY ? logs every SQL query ? OFF in production
# exposes schema/table structure in logs
logging.level.io.r2dbc.postgresql.QUERY=DEBUG

#  SECURITY ? logs every bind parameter ? OFF in production
# logs account numbers, amounts, PII data
logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# postgresql wire protocol ? raw TCP frames (extremely verbose)
logging.level.io.r2dbc.postgresql.client.ReactorNettyClient=DEBUG

# ?? Liquibase ? Database Migration ???????????????????????????????????

# liquibase core ? migration run lifecycle
logging.level.liquibase=INFO

# changelog ? which changesets ran, skipped, or MARK_RAN
logging.level.liquibase.changelog=DEBUG

# executor ? SQL being sent to DB by Liquibase
logging.level.liquibase.executor=DEBUG

# lockservice ? changelog lock acquire and release
logging.level.liquibase.lockservice=DEBUG

# ?? gRPC Server ??????????????????????????????????????????????????????

# grpc core ? channel creation, call lifecycle, stream events
logging.level.io.grpc=INFO

# grpc netty transport ? TLS handshake, connection frame events
logging.level.io.grpc.netty=INFO

# grpc netty shaded ? bundled netty transport
logging.level.io.grpc.netty.shaded=INFO

# grpc-spring-boot-starter ? @GrpcService wiring and registration
logging.level.net.devh=INFO

# grpc server interceptors ? incoming call interceptors
logging.level.net.devh.boot.grpc.server=DEBUG

# grpc client interceptors ? if bank-service calls other gRPC services
logging.level.net.devh.boot.grpc.client=DEBUG

# ?? RabbitMQ ?????????????????????????????????????????????????????????

# spring amqp ? high level: publish, consume, listener containers
logging.level.org.springframework.amqp=INFO

# spring rabbit ? RabbitTemplate, RabbitAdmin, queue declarations
logging.level.org.springframework.amqp.rabbit=DEBUG

# listener container ? consumer lifecycle, message dispatch
logging.level.org.springframework.amqp.rabbit.listener=DEBUG

# rabbit template ? publish/confirm/return callback events
logging.level.org.springframework.amqp.rabbit.core=DEBUG

# rabbitmq java client ? AMQP frames, heartbeat, channel operations
logging.level.com.rabbitmq=INFO

# rabbitmq client internals ? WARN to suppress verbose frame-level noise
logging.level.com.rabbitmq.client.impl=WARN

# ?? Netty ? Reactive HTTP Server/Client ??????????????????????????????

# netty core ? WARN to suppress verbose internal lifecycle events
logging.level.io.netty=WARN

# netty HTTP codec ? HTTP request/response encoding/decoding
logging.level.io.netty.handler.codec.http=DEBUG

# netty SSL/TLS handler ? TLS handshake details
logging.level.io.netty.handler.ssl=INFO

# reactor netty ? reactive HTTP transport layer
logging.level.reactor.netty=INFO

# reactor netty http server ? incoming HTTP at transport level
logging.level.reactor.netty.http.server=DEBUG

# reactor netty http client ? outgoing HTTP (WebClient transport)
logging.level.reactor.netty.http.client=DEBUG

# ?? Reactor ? Project Reactor ????????????????????????????????????????

# reactor core ? INFO to suppress internal operator chain noise
logging.level.reactor.core=INFO

# reactor publisher ? WARN to hide subscription/completion spam
logging.level.reactor.core.publisher=WARN

# ?? WebClient ? Reactive HTTP Client ?????????????????????????????????

# webclient ? request building, response handling
logging.level.org.springframework.web.reactive.function.client=DEBUG

# exchange functions ? full request/response body (??  very verbose)
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=TRACE

# ?? Jackson ? JSON Serialization ?????????????????????????????????????

# jackson ? WARN to suppress normal mapping noise
logging.level.com.fasterxml.jackson=WARN

# jackson databind ? WARN to only show mapping errors
logging.level.com.fasterxml.jackson.databind=WARN

# ?? Hibernate Validator ? Bean Validation ????????????????????????????

# validator ? INFO to show initialization, suppress per-field checks
logging.level.org.hibernate.validator=INFO


# ??????????????????????????????????????????????????????????????????????
# LOG FORMAT ? CONSOLE & FILE PATTERN
# ??????????????????????????????????????????????????????????????????????

# console: timestamp | colored level | thread | logger (36 chars) | message
# %highlight ? ERROR=red WARN=yellow INFO=green DEBUG=cyan TRACE=blue
# %cyan      ? logger name in cyan for readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) : %msg%n

# file: same format but no ANSI color codes (files don't render colors)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n


# ??????????????????????????????????????????????????????????????????????
# LOG FILE OUTPUT
# ??????????????????????????????????????????????????????????????????????

# write logs to file ? in addition to console output
logging.file.name=logs/bank-service.log

# roll over to new file when current reaches 10MB
logging.logback.rollingpolicy.max-file-size=10MB

# keep last 30 days of rolled log files
logging.logback.rollingpolicy.max-history=30

# total disk space cap for all log files combined
logging.logback.rollingpolicy.total-size-cap=500MB

# delete old log files on startup if total-size-cap exceeded
logging.logback.rollingpolicy.clean-history-on-start=false