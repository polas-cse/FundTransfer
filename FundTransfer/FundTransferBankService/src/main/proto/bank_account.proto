syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.fund.transfer.bank.service.grpc.generated";
option java_outer_classname = "BankAccountProto";

package bank.account;

service BankAccountService {
  rpc CreateBankAccount (BankAccountRequest) returns (BankAccountResponse);
  rpc BatchUpdateBankAccount (BankAccountBatchRequest) returns (BankAccountBatchResponse);
}

message BankAccountBatchRequest {
  repeated BankAccountRequest accounts = 1;
}

message BankAccountBatchResponse {
  repeated BankAccountResponse accounts = 1;
  bool success = 2;
  string message = 3;
}

message BankAccountRequest {
  int64  id                   = 1;
  int64  user_id              = 2;
  int64  bank_id              = 3;
  string account_number       = 4;
  string account_type         = 5;
  string account_holder_name  = 6;
  float  balance              = 7;
  string currency             = 8;
  bool   is_primary           = 9;
  int64  created_by           = 10;
}

message BankAccountResponse {
  int64  id                   = 1;
  string account_number       = 2;
  string account_holder_name  = 3;
  bool   success              = 4;
  string message              = 5;
}
